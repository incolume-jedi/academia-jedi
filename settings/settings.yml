  TIMEOUT: 0.8
  TZ: America/Sao_Paulo
development:
  DEBUG_MODE: true
  MSG: Hello Dev
  NAME: Application
production:
  DEBUG_MODE: false
  MSG: Hello User
testing:
  DEBUG_MODE: false
  MSG: Hello tester
  NAME: Application
  TIMEOUT: 1.2
