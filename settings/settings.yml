  BLUE: '#0060B5'
  DATEFMT: '%Y-%m-%dT%H:%M:%S'
  DEBUG_MODE: false
  FONT_COLOR: black
  FORMAT_LOG: '%(asctime)s;%(levelname)-8s;%(name)s;%(module)s;%(funcName)s;%(message)s'
  FORMAT_LOG_WIN: '%(asctime)s;%(levelname)-8s;%(name)s;%(module)s;%(funcName)s;%(message)s'
  MSG: Hello World
  SEMVER: \d+(\.\d+){2}((-\w+\.\d+)|(\w{,2}\d+))?
