version: '3.8'

services:
  python-app:
    image: python:3.10-slim
    container_name: python_app_container
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "pip install poetry && poetry install && tail -f /dev/null"
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on: []