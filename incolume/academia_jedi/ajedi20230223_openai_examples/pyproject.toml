[project]
name = "ajedi20230223-openai-examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10, <4"
dependencies = [
    "icecream>=2.1.4",
]

[dependency-groups]
dev = [
    "ajedi20230223-openai-examples",
    "nltk>=3.8.1",
    "openai>=0.26.0",
    "scikit-learn>=1.6.1",
    "pyspellchecker",
    "textblob>=0.17.1",
    "transformers>=4.26.1",
]

[tool.uv.sources]
ajedi20230223-openai-examples = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ajedi20230223_openai_examples"]
