services:
  postgres:
    image: postgres:14-alpine3.16
    restart: unless-stopped
    user: postgres:postgres
    env_file:
      - .env
    container_name: "db_${COMPOSE_PROJECT_NAME:-demo}"
    ports:
      - 5432:5432
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${DB_DATABASE:-demo}"
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=pgadmin4@incolume.com.br
      - PGADMIN_DEFAULT_PASSWORD="${DB_DATABASE:-admin1234}"
    ports:
      - '5050:80'
    volumes:
      - ./volumes/pgadmin:/root/.pgadmin

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - ./volumes/redisdata:/bitnami/redis/data




