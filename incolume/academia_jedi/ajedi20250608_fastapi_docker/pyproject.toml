[project]
name = "ajedi20250608-fastapi-docker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ricardo Brito do Nascimento", email = "ricardo.brito@presidencia.gov.br" }
]
requires-python = ">=3.10, <4"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.21.1",
]

[project.scripts]
ajedi20250608-fastapi-docker = "ajedi20250608_fastapi_docker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ajedi20250608-fastapi-docker",
]

[tool.uv.sources]
ajedi20250608-fastapi-docker = { workspace = true }
